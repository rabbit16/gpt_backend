<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>外边距和内边距示例</title>
    <style>
        .box {
            margin: 20px; /* 外边距 */
            border: 5px solid #333; /* 边框 */
            padding: 15px; /* 内边距 */
            background-color: #f0f0f0; /* 背景颜色 */
        }
    </style>
</head>
<body>
    <div class="box">
        这是一个带有外边距、内边距和边框的盒子。
    </div>
</body>
</html>
