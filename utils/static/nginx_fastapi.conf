server {
    # 监听端口
    listen      80;

    # 服务器域名或者ip地址
    server_name 127.0.0.1;

    # 编码
    charset     utf-8;

    # 文件最大上传大小
    client_max_body_size 51M;
    # 主目录
    location / {
        proxy_pass http://0.0.0.0:8888;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
